# The copy catalog: every text the program renders or carries in its error
# chains, one entry per constant. Each table names the package directory
# whose generated constants file its entries fill; the entry key is the Go
# constant name, and each entry's comment names the file and condition that
# uses it. Page-scale copy stays in the .tmpl files beside this catalog.
# After editing, regenerate:
#   cd internal/templates && go generate

# Package cmd/bild
# The command surface's copy: the flag descriptions, command summaries,
# and usage forms, plus the change-notice reasons the command layer creates.
#   - ArgCountForm: usage.go - argCountError: the chain form carrying the command, the classification, and the count received
#   - FlagDefaultSuffix: bild.go - renderFlagEntry: appended to a flag entry that shows a default
#   - FlagsBeforeCommandForm: cli.go - the usage error for a flag placed before a command word
#   - HelpFlagCombinedForm: usage.go - the usage error for a help or version flag beside a positional argument
#   - HelpFlagHelp: cli.go - the help flag's description
#   - HelpSummary: bild.go - the help row in the general help's commands section
#   - HelpUsageForm: bild.go - the help command's usage line
#   - InfoImageFilterHelp: cli.go - the info command's image filter
#   - InfoSummary: bild.go - the info row in the general help's commands section
#   - InfoUsageForm: bild.go - the info command's usage line
#   - InfoVideoFilterHelp: cli.go - the info command's video filter
#   - JSONFlagHelp: cli.go - the --json flag's description
#   - ListImageFilterHelp: cli.go - the list command's image filter
#   - ListModelsFlagHelp: cli.go - the --models filter's description
#   - ListProvidersFlagHelp: cli.go - the --providers filter's description
#   - ListSummary: bild.go - the list row in the general help's commands section
#   - ListUsageForm: bild.go - the list command's usage line
#   - ListVideoFilterHelp: cli.go - the list command's video filter
#   - ModelFlagHelp: bild.go - the --model flag's description
#   - NoDefaultModel: generate.go - the usage error when no configured provider carries a default model
#   - OutputPathFlagHelp: bild.go - the --output-path flag's description
#   - PrintFilenameFlagHelp: bild.go - the --print-filename flag's description
#   - ReasonContentOwnFormat: outpath.go - a named extension replaced by the content's true format
#   - ReasonSupersededByOutputPath: outpath.go - the output path outranks a conflicting directory or format
#   - RootUsageForms: bild.go - the general help's usage block
#   - SaveResultsFlagHelp: bild.go - the --save-results flag's description
#   - SearchExcludeFlagHelp: cli.go - the search command's --exclude flag
#   - SearchImageFilterHelp: cli.go - the search command's image filter
#   - SearchModelsFlagHelp: cli.go - the search command's --models filter
#   - SearchProvidersFlagHelp: cli.go - the search command's --providers filter
#   - SearchRegexFlagHelp: cli.go - the search command's --regex switch
#   - SearchSummary: bild.go - the search row in the general help's commands section
#   - SearchTermEmpty: usage.go - the usage error for a search or exclusion term typed as the empty string
#   - SearchTermMissing: usage.go - the usage error for a search given neither term
#   - SearchUsageForm: bild.go - the search command's usage line
#   - SearchVideoFilterHelp: cli.go - the search command's video filter
#   - SupportedBySentence: bild.go - cliRenderFlagEntry: appended when not every provider supports the flag
#   - VersionFlagHelp: cli.go - the version flag's description
#   - VersionReport: bild.go - the standalone version output
