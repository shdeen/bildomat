# The rendered output: the change-notice forms, the failure messages, the
# interactive prompts, the run output, and the list and info page fragments.
#   - APIKeyNotSet: errs.go: the statement's floor when the chain names no variable
#   - AliasMatchExample: info.go: the clause naming an alias a keyword example matches
#   - AliasWordPlural: list.go aliasWord: the label before several aliases
#   - AliasWordSingular: list.go aliasWord: the label before one alias
#   - AllowedRange: constraints.go: a parameter with both bounds
#   - AllowedValues: constraints.go: a parameter's declared value set
#   - AmbiguityCandidate: errs.go PrintAmbiguity: one candidate key under the heading
#   - AmbiguityHeading: errs.go PrintAmbiguity; the candidate keys list under it, one per line
#   - CardPromptIgnored: info.go modelCardData: the model card's prompt line value for a model that ignores the prompt
#   - CatalogCountForm: info.go catalogMediaCounts: a medium's model count above one
#   - CatalogCountFormOne: info.go catalogMediaCounts: a medium's model count of one
#   - CatalogSeparator: info.go catalogMediaCounts: between the per-medium counts
#   - ConfigFileUnreadable: errs.go configWarningMessage: a user config file that cannot be read or decoded
#   - ConfigLocationUnresolved: errs.go configWarningMessage: a failed home lookup, so no config file was read
#   - ConfigUnknownProvider: errs.go configWarningMessage: a non-empty api-keys entry naming an unknown provider
#   - ConfigUnknownSetting: errs.go configWarningMessage: a top-level key the config schema does not declare
#   - CounterHoursForm: progress.go ElapsedText: the counter from one hour on
#   - CounterMinutesForm: progress.go ElapsedText: the counter from one minute on
#   - CounterSecondsForm: progress.go ElapsedText: the truncated-decimal seconds
#   - CredentialMissing: errs.go ErrorMessage: a missing API key with no provider resolved yet
#   - CredentialMissingProvider: errs.go ErrorMessage: a missing API key with the provider resolved
#   - EdgeIncrements: constraints.go sizeBoundsNotice
#   - EdgeRange: constraints.go sizeBoundsNotice
#   - ErrorPrefix: errs.go errorPrefix: the word opening every error line
#   - ExamplesSentence: bild.go paramFlagUsage and info.go entryDetails: a flag's example values
#   - FileSizeBytesForm: progress.go FileSizeText: a size under a thousand bytes
#   - FileSizeGBForm: progress.go FileSizeText: a size in gigabytes
#   - FileSizeKBForm: progress.go FileSizeText: a size in kilobytes
#   - FileSizeMBForm: progress.go FileSizeText: a size in megabytes
#   - FlagAdjusted: param.go formatNotice: snapped, derived, and conformed changes
#   - FlagAdjustedReason: param.go formatNotice: forced changes
#   - FlagBelowLimit: param.go formatNotice: raised values
#   - FlagChangedGuard: param.go formatNotice: repository-defect guard for an unrecognized classification
#   - FlagExceedsLimit: param.go formatNotice: capped values
#   - FlagIgnored: param.go formatNotice: ignored values
#   - FlagNotAllowed: param.go formatNotice: rejected values
#   - FlagNotSupported: param.go formatNotice: dropped values
#   - FrameTimeInvalidGeneric: errs.go: the floor when the chain carries no frame detail
#   - FrontMatterModelForm: sidecar.go RenderSidecar: the model line of the front matter
#   - FrontMatterParamForm: sidecar.go RenderSidecar: a parameter line of the front matter
#   - FrontMatterPromptForm: sidecar.go RenderSidecar: the prompt line of the front matter
#   - FrontMatterTimestampForm: sidecar.go RenderSidecar: the timestamp line of the front matter
#   - GenerationCanceled: errs.go ErrorMessage: a run interrupted through Ctrl-C; renders unprefixed
#   - GenerationCompleted: progress.go: the terminal completion report
#   - GenerationStatus: progress.go: the animated terminal status line, naming the medium of the run
#   - GroupIntro: info.go groupLines: the line opening a group of models declaring a flag alike
#   - GroupIntroRemainder: info.go groupLines: the line opening the largest group, named by exclusion
#   - HelpTipsHeading: helptips.go HelpTips: the heading that opens the tips section of the general help page
#   - InputMediaFormat: errs.go ErrorMessage: an input file or URL of an unsupported type
#   - InputMediaInvalid: errs.go ErrorMessage: the same failure when the chain names no source
#   - InputMediaNotFound: errs.go ErrorMessage: an input path that does not exist
#   - InputMediaSourceInvalid: errs.go ErrorMessage: an unreadable, empty, or oversized input, naming its source
#   - KeywordMatchExample: info.go: the sentence naming the model a keyword example matches
#   - ListLastAnd: info.go joinNames: the last two items of a list of three or more joined with and
#   - ListLastOr: info.go joinNames: the last two items of a list of three or more joined with or
#   - ListPairAnd: info.go joinNames: a list of two items joined with and
#   - ListPairOr: info.go joinNames: a list of two items joined with or
#   - ListSeparator: info.go joinNames: the separator between the items of a list before the last
#   - LongEdge: constraints.go sizeBoundsNotice
#   - MaximumEdge: constraints.go sizeBoundsNotice
#   - MaximumPixels: constraints.go sizeBoundsNotice
#   - MaximumValue: constraints.go: a parameter with only an upper bound
#   - MediaLabelImages: constraints.go: the image medium's word on the details pages
#   - MediaLabelVideo: constraints.go: the video medium's word on the details pages
#   - MinimumEdge: constraints.go sizeBoundsNotice
#   - MinimumPixels: constraints.go sizeBoundsNotice
#   - MinimumValue: constraints.go: a parameter with only a lower bound
#   - ModelAliasListing: list.go: a model row in the nested listing
#   - ModelAmbiguous: errs.go ErrorMessage: a specifier matching more than one model
#   - ModelHeader: output.go PrintRunDetails: the run header's model name
#   - ModelUnknown: errs.go ErrorMessage: a specifier matching no model
#   - ModelUnknownGeneric: errs.go ErrorMessage: the same failure when the chain names no specifier
#   - NoAdditionalLimits: info.go groupLines: a model group with no declared parameter limits
#   - NotUsedBy: info.go scopeNote: the models of the medium not declaring a flag most declare
#   - OnlyForModels: info.go scopeNote: the models declaring a flag most models do not
#   - OutPathDisplayName: param.go: the output-path flag's name in a change notice
#   - OutputCleanupFailed: errs.go - an owned temporary file could not be removed
#   - OutputWriteFailed: errs.go ErrorMessage: a failed artifact or results write
#   - PixelRange: constraints.go sizeBoundsNotice
#   - ProviderConfigBroken: errs.go ErrorMessage: an embedded provider config failing validation
#   - ProviderConfigBrokenDetail: errs.go ErrorMessage: the same failure carrying its specific fault
#   - ProviderFallbackAsName: output.go providerName: the header's stand-in for an empty provider name
#   - ProviderFallbackInSentence: output.go providerDisplay: the mid-sentence stand-in for an empty provider name
#   - ProviderHeader: output.go PrintRunDetails: the run header's provider name, the label alone
#   - ProviderSelectModels: list.go: a provider with partial support in a flag's support note
#   - ProviderServerError: errs.go ErrorMessage: any error a provider's server returns, 4xx and 5xx alike
#   - RatioBetween: constraints.go sizeBoundsNotice
#   - RepeatMaximum: constraints.go: a repeatable parameter's count limit
#   - Reprompt: errs.go PrintReprompt
#   - RequiredLabel: info.go requirementSentence: the required classification opening an info entry; an optional parameter carries none
#   - ResponseUnusable: errs.go ErrorMessage: a provider response with no extractable server message
#   - RuleDescription: constraints.go: a parameter's configured rule description
#   - SavedReport: disk.go: the plain saved-file report
#   - SavedReportStyled: progress.go: the terminal saved-file report
#   - SearchTooManyResults: errs.go ErrorMessage: a list search whose results exceed the display limit
#   - SingleWordConfirmation: errs.go PrintSingleWordPromptConfirmation
#   - SizeRequirements: constraints.go: the frame for a free-form size's constraint list
#   - TransportTimeout: errs.go ErrorMessage: a poll that outlived its deadline
#   - TransportUnreachable: errs.go ErrorMessage: a request that never reached the provider
#   - WarningPrefix: errs.go PrintUserConfigWarning: the word opening every warning line
#   - WorkingDirFailed: errs.go ErrorMessage: the working directory could not be determined
