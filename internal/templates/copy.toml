["tools/flagsetup"]
FlagAliasDuplicate  = "flag %s: duplicate alias %q"
FlagDataTypeInvalid = "flag %s: data type %q not one of string|number|integer|boolean"
FlagIDDuplicate     = "duplicate flag ID %q"

# Parameter adjustment notices.
#   - BoundMaxForm: paramchange.go - a value capped at its declared maximum
#   - BoundMinForm: paramchange.go - a value raised to its declared minimum
#   - ReasonModelLimits: paramchange.go - dimensions adjusted to the model limits
#   - ReasonSupersededBySize: paramchange.go - an explicit size supersedes ratio or resolution
["internal/params"]

#   - BoundsAndValuesConflict: provconfig.go - a parameter declaring size bounds and a value set
BoundsAndValuesConflict = "size bounds and allowed values both declared"
#   - NegativeMaxMultipleForm: param.go - a negative maxMultiple, naming the declared value
NegativeMaxMultipleForm = "negative maxMultiple %d"
#   - RangeBoundNegative: provconfig.go - a negative range bound
RangeBoundNegative = "negative range bound"
#   - RangeInverted: provconfig.go - a minimum above its maximum
RangeInverted = "minValue %s exceeds maxValue %s"
#   - ValuesAndRangeConflict: provconfig.go - a parameter declaring a value set and a range
ValuesAndRangeConflict = "allowed values and a range both declared"

BoundMaxForm                 = "max %s"
BoundMinForm                 = "min %s"
ReasonModelLimits            = "%s limits"
ReasonSupersededBySize       = "superseded by Size %s"

# Media input and image transformation diagnostics.
#   - FrameTimeInvalid: input.go - a negative or non-finite frame prefix
#   - ImageIndexForm: conform.go - the image position on a decoding failure
#   - IndexForm: conform.go - the input position on an incompatible source
["internal/media"]
FrameTimeInvalid = "The input media %s has invalid keyframe timing."
ImageIndexForm = "image %d"
IndexForm = "media %d"

# Provisional binary retention markers approved for persisted generation records.
#   - BinarySaved: binary.go - encoded bytes saved or matched to a completed file
#   - BinaryUnavailable: binary.go - decoding or saving encoded bytes failed
["internal/metadata"]
BinarySaved = "[Bildomat: base64 data redacted for length; saved locally to %s]"
BinaryUnavailable = "[Bildomat: base64 data unavailable; see persistence-errors]"

# Generated-media diagnostics.
#   - ResponseEmptyInline: media.go - an inline artifact with zero bytes
["internal/artifact"]
ResponseEmptyInline = "empty inline result"

# HTTP response and polling diagnostics.
#   - ByteLimitForm: inputmedia.go - the oversized-read context naming the byte limit
#   - StatusExcerptForm: download.go - the endpoint and response status with a body excerpt
#   - TimeoutAfterForm: poll.go - the elapsed poll budget
["internal/httpapi"]
ByteLimitForm = "limit %d bytes"
StatusExcerptForm = "%s: status %d: %s"
TimeoutAfterForm = "after %s"

# Credential and provider-response context.
#   - APIKeyMissingForm: credential.go - the missing key's environment variable and configuration setting
#   - StatusContextForm: provider decoders - the endpoint or label and response status
["internal/errs"]
APIKeyMissingForm = "%s %s (config key: api-keys.%s in ~/.bildomat/config.yml)"
StatusContextForm = "%s: status %v"

# internal/catalog owns these diagnostics and preparation notices.
["internal/catalog"]
#   - AliasContextForm: catalog.go - the duplicate-alias fault context: the provider-model pair and the alias
AliasContextForm = "%s alias %s"
#   - AllowedValueBelowCount: provconfig.go - a declared member of num-images under one
AllowedValueBelowCount = "model %s, flag %s: allowed value %q below the minimum count of one"
#   - AllowedValueFault: provconfig.go - a declared value that does not parse as the flag's type
AllowedValueFault = "model %s, flag %s: allowed value %s"
#   - ConfigMissing: provconfig.go - a provider document without its config section
ConfigMissing = "no config section holding the request settings"
#   - ConfigProviderSourceMismatch: catalog.go - a configuration naming a different provider than its source
ConfigProviderSourceMismatch = "%s: declares provider %q under the %q source"
#   - FrameMediaIncomplete: provconfig.go - a video API declaring only part of its frame fields
FrameMediaIncomplete = "VideoAPI: incomplete frame-media description"
#   - ImageAPIMissing: provconfig.go - image models declared without an image API
ImageAPIMissing = "no ImageAPI for the declared image medium"
#   - ImageFallbackExtMissing: provconfig.go - image models declared without a fallback extension
ImageFallbackExtMissing = "AdapterAPI: no ImageFallbackExt for the declared image medium"
#   - InputMediaEncodingConflict: provconfig.go - encoding and layout disagree
InputMediaEncodingConflict = "%s: input media encoding %q cannot use style %q"
#   - InputMediaParamMissing: provconfig.go - a declared layout lacks required field names
InputMediaParamMissing = "%s: required input media field name is missing"
#   - InputMediaPayloadTypeInvalid: provconfig.go - a request encoding outside the closed vocabulary
InputMediaPayloadTypeInvalid = "%s: InputMediaPayloadType %q invalid (want json|form)"
#   - InputMediaStyleInvalid: provconfig.go - a media layout outside the closed vocabulary
InputMediaStyleInvalid = "%s: InputMediaStyle %q invalid (want parts|nested|single-or-array|string)"
#   - ModelFlagDuplicate: provconfig.go - one flag configured twice on a model
ModelFlagDuplicate = "model %s: duplicate params entry for flag %s"
#   - ModelFlagFault: provconfig.go - frames one of the four constraint faults
ModelFlagFault = "model %s, flag %s: %s"
#   - ModelIDMissing: provconfig.go - a model has no selectable identifier
ModelIDMissing = "model ID must not be empty"
#   - ModelMediaInvalid: provconfig.go - a media value outside image|video
ModelMediaInvalid = "model %s: invalid Media %q (want image|video)"
#   - ModelNameMissing: provconfig.go - a model without a published name
ModelNameMissing = "model %s: no name declared"
#   - ParamGuidanceMissing: provconfig.go - a parameter declaring no values, range, or size bounds under a flag record with no text hint or example values
ParamGuidanceMissing = "model %s, flag %s: no allowed values, range, or size bounds declared, and the flag record has no text hint or example values"
#   - ParamsFlagUnknown: provconfig.go - a configured flag that no enumeration record declares
ParamsFlagUnknown = "model %s: params entry flagID %q names no enumerated flag"
#   - PollBudgetNotPositive: poll.go - a video API poll budget of zero or less
PollBudgetNotPositive = "VideoAPI: PollTimeout %d not positive"
#   - PollIntervalInvalid: poll.go - an adapter poll interval of zero or less
PollIntervalInvalid = "%s: interval %d not positive"
#   - PollIntervalNotPositive: poll.go - a video API poll interval of zero or less
PollIntervalNotPositive = "VideoAPI: PollInterval %d not positive"
#   - PollTimeoutInvalid: poll.go - an adapter poll budget of zero or less
PollTimeoutInvalid = "%s: timeout %d not positive"
#   - ProviderDefaultModelUnknown: provconfig.go - a defaultModel naming no model of its provider
ProviderDefaultModelUnknown = "provider %s: defaultModel %q names no model of the provider"
#   - RequestPathConflict: requestpath.go - separately configured fields overwrite one another
RequestPathConflict = "model %s: request paths %q and %q conflict"
#   - RequestPathInvalid: requestpath.go - a configurable field path contains an empty segment
RequestPathInvalid = "model %s: request path %q contains an empty segment"
#   - StringParamsUnknownFlag: provconfig.go - a StringParams entry naming no enumerated flag
StringParamsUnknownFlag = "StringParams: unknown flagID %q"
#   - VideoAPIMissing: provconfig.go - video models declared without a video API
VideoAPIMissing = "no VideoAPI for the declared video medium"
#   - VideoFallbackExtMissing: provconfig.go - video models declared without a fallback extension
VideoFallbackExtMissing = "AdapterAPI: no VideoFallbackExt for the declared video medium"

# internal/generation owns these diagnostics and preparation notices.
["internal/generation"]
#   - FrameAnchorConflict: frame.go - first: or last: claimed by two inputs
FrameAnchorConflict = "%s and %s both request the %s frame."
#   - FrameCountExceeded: frame.go - more timed inputs than free frames
FrameCountExceeded = "%d timed inputs exceed the model's opening and closing frames."
#   - FrameOnVideo: frame.go - a frame prefix on a video source
FrameOnVideo = "A video input cannot take a frame prefix: %s."
#   - FrameTimeShared: frame.go - two inputs sharing one time, so no order exists
FrameTimeShared = "%s and %s share the frame time %g."
#   - ReasonAdoptedFromReference: conform.go - a request size taken from the first local reference image
ReasonAdoptedFromReference = "adopted from the reference image"
#   - ReasonFrameTimeSnapped: frame.go - a numeric frame time moved to the first or last frame
ReasonFrameTimeSnapped = "frame time %g snapped to the %s frame"
#   - ReasonMatchedToRequest: conform.go - a reference image resized to the request frame
ReasonMatchedToRequest = "matched to %s request"
#   - ReasonNoFramePrefix: frame.go - a frame prefix dropped on a model without frame support
ReasonNoFramePrefix = "the model does not accept a frame prefix"
#   - ReasonNotConsumed: paramchange.go - a supplied flag the model does not accept
ReasonNotConsumed = "not consumed by %s"
